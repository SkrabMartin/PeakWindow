name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.10.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install from the frozen lockfile
        run: uv sync --frozen --group dev --group dashboard

      - name: Ruff lint
        run: uv run --frozen ruff check .

      - name: Ruff format
        run: uv run --frozen ruff format --check .

      - name: Mypy (strict)
        run: uv run --frozen mypy src/peakwindow

      - name: Pytest
        run: uv run --frozen pytest

      - name: CLI smoke test on the synthetic fixture
        run: uv run --frozen peakwindow validate-data --input data/fixtures/synthetic_hourly_load.csv --synthetic --output artifacts/fixture-quality.json
