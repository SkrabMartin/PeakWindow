[project]
name = "peakwindow"
version = "0.2.0"
description = "Electricity demand forecasting laboratory for historical Czech national load (Phase 1: data ingestion and audit)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martin Škrabana" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=3.0",
    "pyarrow>=18",
    "tzdata>=2024.1",
]

[project.scripts]
peakwindow = "peakwindow.cli:main"

[dependency-groups]
dev = ["mypy>=1.10", "pandas-stubs>=3.0", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peakwindow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
